<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #ffffff; --ink: #14161c; --soft: #6b7384; --line: #e6e8ee;
    --accent: #3b6ef5; --ok: #1f9d6b; --danger: #d1495b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171e; --ink: #e9ebf1; --soft: #9aa3b5; --line: #2a2e3a; --accent: #6a93ff; --ok: #45c08a; --danger: #e86b7c; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 320px; background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 16px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; margin-bottom: 2px; }
  .mk { width: 16px; height: 16px; border-radius: 4px; background: var(--accent); }
  .site { color: var(--soft); font-size: 12px; margin: 2px 0 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.cta {
    width: 100%; border: 0; border-radius: 9px; padding: 11px; font-weight: 650; font-size: 13px;
    background: var(--accent); color: #fff; cursor: pointer; transition: opacity .12s ease;
  }
  button.cta:hover { opacity: .92; }
  button.cta:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 12px; font-size: 12px; color: var(--soft); min-height: 16px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--danger); }
  .foot { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--soft); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--soft); }
  .dot.on { background: var(--ok); }
</style>
</head>
<body>
  <div class="brand"><span class="mk"></span> Weft</div>
  <div class="site" id="site">—</div>
  <button class="cta" id="convert">Convert this site to MCP</button>
  <div class="msg" id="msg"></div>
  <div class="foot"><span class="dot" id="dot"></span><span id="conn">connecting to app…</span></div>
  <script src="popup.js"></script>
</body>
</html>
