name: Release

# Tag a version (e.g. v0.1.0) to build the Windows and Linux bundles and attach them to a draft
# GitHub Release. The macOS build is signed with a Developer ID and notarized on the maintainer's
# Mac (the signing identity never leaves that keychain) and uploaded to the same release:
#   cd apps/desktop && APPLE_SIGNING_IDENTITY=... APPLE_API_KEY=... APPLE_API_ISSUER=... \
#     APPLE_API_KEY_PATH=... npm run tauri build -- --target universal-apple-darwin
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential curl wget file libxdo-dev libssl-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Weft ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
