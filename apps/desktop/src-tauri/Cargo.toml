[package]
name = "weft-desktop"
version = "0.1.1"
edition = "2021"
description = "Weft — weave any site you're logged into into a local MCP server."
default-run = "weft-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
weft-core = { path = "../../../crates/weft-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]
